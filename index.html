<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengumpulan Tugas | SMA Negeri 1 Dangia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-4 border-blue-600">
        
        <!-- BAGIAN LOGO DITAMBAHKAN DI SINI -->
        <div class="flex justify-center mb-4">
            <img src="SMANSAD.png" alt="Logo SMA Negeri 1 Dangia" class="w-24 h-24 object-contain">
        </div>

        <h2 class="text-2xl font-bold text-gray-800 text-center mb-2">Ruang Tugas</h2>
        <p class="text-sm text-gray-500 text-center mb-6">English Class - Mr. Erdy Laba</p>

        <form id="uploadForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Nama Lengkap</label>
                <input type="text" id="nama" required class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Kelas</label>
                <select id="kelas" required class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">-- Pilih Kelas --</option>
                    <option value="XI">Kelas XI</option>
                    <option value="XII">Kelas XII</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">File Tugas</label>
                <input type="file" id="fileInput" required class="mt-1 w-full p-2 text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-300">
                Kirim Tugas Sekarang
            </button>
        </form>

        <div id="successMsg" class="hidden mt-6 bg-green-100 text-green-800 p-4 rounded-lg text-center font-medium animate-pulse">
            Tugas berhasil dikumpulkan! Terima kasih. 🎉
        </div>
    </div>

    <script>
        // JANGAN LUPA: PASTE URL DARI GOOGLE SCRIPT V2 BAPAK DI SINI:
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwIlMqjXN5j1RCHwbefX4BQdKe2iPq1riNCfbK4Nch-rUOe2_U6b4Kwgh1EkRXYUOJX/exec'; 
        
        const form = document.getElementById('uploadForm');
        const btn = document.getElementById('submitBtn');
        const successMsg = document.getElementById('successMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const file = document.getElementById('fileInput').files[0];
            if(!file) return;

            btn.innerText = '⏳ Sedang Mengirim...';
            btn.disabled = true;
            btn.classList.replace('bg-blue-600', 'bg-gray-400');

            const reader = new FileReader();
            reader.onload = async function() {
                const base64Data = reader.result.split(',')[1];
                
                const formData = new URLSearchParams();
                formData.append('nama', document.getElementById('nama').value);
                formData.append('kelas', document.getElementById('kelas').value);
                formData.append('fileName', file.name);
                formData.append('mimeType', file.type);
                formData.append('fileData', base64Data);

                try {
                    await fetch(scriptURL, {
                        method: 'POST',
                        body: formData 
                    });
                    
                    form.reset();
                    form.style.display = 'none';
                    successMsg.classList.remove('hidden');

                    confetti({
                        particleCount: 150,
                        spread: 80,
                        origin: { y: 0.6 },
                        colors: ['#26ccff', '#a25afd', '#ff5e7e', '#88ff5a', '#fcff42']
                    });
                    
                    setTimeout(() => {
                        confetti({ particleCount: 100, angle: 60, spread: 55, origin: { x: 0 } });
                        confetti({ particleCount: 100, angle: 120, spread: 55, origin: { x: 1 } });
                    }, 400);

                } catch (error) {
                    alert('Koneksi terputus. Silakan coba lagi.');
                } finally {
                    btn.innerText = 'Kirim Tugas Sekarang';
                    btn.disabled = false;
                    btn.classList.replace('bg-gray-400', 'bg-blue-600');
                }
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
